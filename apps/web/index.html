<!doctype html>
<html lang="pt-BR" data-mantine-color-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Telemetria · Mauá Racing Baja</title>
  <meta name="description" content="Telemetria da Mauá Racing Baja: logs da FT450 e do GPS em gráficos e números para o projeto do carro.">
  <meta name="theme-color" content="#141517">
  <link rel="icon" type="image/png" href="/src/assets/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/src/assets/brand/apple-touch-icon.png">
  <script>
    /* tema salvo antes do React montar (evita piscar claro/escuro) */
    try {
      var p = JSON.parse(localStorage.getItem('baja:prefs') || '{}'), t = p.theme || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mantine-color-scheme', t);
    } catch (e) { /* sem localStorage: escuro */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
